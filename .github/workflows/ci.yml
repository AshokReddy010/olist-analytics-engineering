name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: pip install -r requirements.txt

      - name: Install dbt packages
        run: dbt deps

      - name: Build and test all models
        run: dbt build

      - name: Run again to exercise the incremental model
        run: dbt build --select fct_orders
        