name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dbt
        run: pip install -r requirements.txt

      - name: Install dbt packages
        run: dbt deps

      - name: Build and test all models
        run: dbt build

      - name: Run again to exercise the incremental model
        run: dbt build --select fct_orders

      - name: The web dashboard data matches the models
        run: |
          cp site/data/olist.json /tmp/committed.json
          python scripts/export_web.py
          python scripts/check_web_data.py /tmp/committed.json site/data/olist.json

      - name: The dbt docs build
        run: dbt docs generate --static
